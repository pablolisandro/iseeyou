<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I SEE YOU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #E8E0D0;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        /* TAB NAVIGATION */
        .tab-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: rgba(232, 224, 208, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 0;
        }

        .tab-button {
            padding: 20px 40px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: none;
            border: none;
            cursor: pointer;
            color: #1a1a1a;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
            opacity: 0.6;
        }

        .tab-button.active {
            opacity: 1;
            border-bottom-color: #1a1a1a;
        }

        .tab-button:hover {
            opacity: 0.8;
        }

        /* TAB CONTENT */
        .tab-content {
            display: none;
            padding-top: 80px;
        }

        .tab-content.active {
            display: block;
        }

        .section {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            flex-shrink: 0;
            scroll-snap-align: start;
        }

        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        /* TITLE SECTION */
        .title-section {
            flex-direction: column;
            gap: 80px;
            padding-top: 80px;
        }

        .title-text {
            text-align: center;
        }

        .title-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(48px, 10vw, 96px);
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            line-height: 1.1;
        }

        .title-text p {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* ENVELOPE SECTION */
        .envelope-section {
            justify-content: center;
        }

        .envelope-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .envelope-image {
            width: 100%;
            height: auto;
            max-width: 600px;
            display: block;
            object-fit: contain;
        }

        /* CONTENT SECTION */
        .content-section {
            flex-direction: column;
            gap: 40px;
        }

        .chapter-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .chapter-label {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 16px;
            opacity: 0.7;
        }

        .chapter-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(48px, 8vw, 72px);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.1;
        }

        .chapter-divider {
            width: 60px;
            height: 1px;
            background-color: #1a1a1a;
            margin: 20px auto;
        }

        .chapter-content {
            max-width: 600px;
            margin: 40px auto 0;
            text-align: center;
        }

        .chapter-content p {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 300;
            line-height: 1.8;
            margin-bottom: 16px;
        }

        /* CARD SECTION */
        .card-container {
            width: 100%;
            max-width: 500px;
            background-color: #F5EEE5;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 400;
            letter-spacing: -0.01em;
            margin-bottom: 24px;
            line-height: 1.3;
        }

        .card-text {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .card-italic {
            font-style: italic;
        }

        /* MAGAZINE COVER */
        .magazine-cover {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 40px 60px;
        }

        .magazine-cover-container {
            width: 100%;
            max-width: 1000px;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .magazine-cover-text {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            padding-right: 40px;
        }

        .magazine-issue {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .magazine-date {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.7;
            text-align: right;
            position: absolute;
            top: 100px;
            right: 60px;
        }

        .magazine-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(64px, 10vw, 128px);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 0.9;
            word-break: break-word;
        }

        .magazine-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: clamp(32px, 6vw, 64px);
            font-weight: 400;
            letter-spacing: -0.01em;
            opacity: 0.8;
        }

        .magazine-divider {
            width: 60px;
            height: 1px;
            background-color: #1a1a1a;
            margin: 20px 0;
        }

        .magazine-tags {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            line-height: 1.8;
        }

        .magazine-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .magazine-cover-image-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 2px;
        }

        .magazine-vol {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: auto;
            opacity: 0.7;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .magazine-cover-container {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .magazine-cover-text {
                padding-right: 0;
            }

            .magazine-cover {
                padding: 100px 40px 60px;
            }
        }

        @media (max-width: 768px) {
            .tab-nav {
                flex-wrap: wrap;
                gap: 0;
            }

            .tab-button {
                padding: 16px 24px;
                font-size: 12px;
                flex: 1;
            }

            .section {
                padding: 40px 20px;
            }

            .title-text h1 {
                font-size: 42px;
            }

            .chapter-title {
                font-size: 48px;
            }

            .card-container {
                padding: 40px 30px;
            }

            .card-title {
                font-size: 28px;
            }

            .magazine-cover {
                padding: 80px 30px 60px;
            }

            .magazine-title {
                font-size: 48px;
            }

            .magazine-subtitle {
                font-size: 32px;
            }

            .magazine-date {
                font-size: 10px;
                right: 30px;
                top: 80px;
            }
        }

        @media (max-width: 480px) {
            .tab-button {
                padding: 12px 16px;
                font-size: 11px;
            }

            .title-text h1 {
                font-size: 36px;
            }

            .chapter-title {
                font-size: 36px;
            }

            .card-container {
                padding: 30px 20px;
            }

            .card-title {
                font-size: 24px;
            }

            .chapter-content p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- TAB NAVIGATION -->
    <nav class="tab-nav">
        <button class="tab-button active" onclick="switchTab('chapter01')">CHAPTER 01</button>
        <button class="tab-button" onclick="switchTab('chapter02')">CHAPTER 02</button>
        <button class="tab-button" onclick="switchTab('magazine')">MAGAZINE</button>
    </nav>

    <!-- CHAPTER 01 CONTENT -->
    <div id="chapter01" class="tab-content active">
        <!-- TITLE SECTION -->
        <section class="section title-section">
            <div class="title-text">
                <h1>I SEE YOU</h1>
                <p>October 10, 2026</p>
            </div>
        </section>

        <!-- ENVELOPE CLOSED -->
        <section class="section envelope-section">
            <div class="envelope-container">
                <img src="sobre-closed.png" alt="Envelope closed" class="envelope-image">
            </div>
        </section>

        <!-- ENVELOPE FRONT WITH CHAPTER -->
        <section class="section content-section">
            <div class="envelope-container">
                <img src="sobre-front.png" alt="Envelope front - Chapter 01 HERE" class="envelope-image">
            </div>
        </section>

        <!-- CARD -->
        <section class="section">
            <div class="card-container">
                <h2 class="card-title">I SEE YOU HERE.</h2>
                <div class="chapter-divider" style="margin: 20px auto 30px;"></div>
                <p class="card-text">La bienvenida.</p>
                <p class="card-text">
                    Ahora que llegaste,<br>
                    <span class="card-italic">empieza algo hecho para vos.</span>
                </p>
            </div>
        </section>
    </div>

    <!-- CHAPTER 02 CONTENT -->
    <div id="chapter02" class="tab-content">
        <!-- TITLE SECTION -->
        <section class="section title-section">
            <div class="title-text">
                <h1>I SEE YOU</h1>
                <p>October 10, 2026</p>
            </div>
        </section>

        <!-- ENVELOPE CLOSED -->
        <section class="section envelope-section">
            <div class="envelope-container">
                <img src="chapter02-page-000.png" alt="Envelope closed - Chapter 02" class="envelope-image">
            </div>
        </section>

        <!-- ENVELOPE FRONT WITH CHAPTER -->
        <section class="section content-section">
            <div class="envelope-container">
                <img src="chapter02-page-001.png" alt="Envelope front - Chapter 02 TIRED" class="envelope-image">
            </div>
        </section>

        <!-- CARD -->
        <section class="section">
            <div class="card-container">
                <h2 class="card-title">I SEE YOU TIRED.</h2>
                <div class="chapter-divider" style="margin: 20px auto 30px;"></div>
                <p class="card-text">El spa.</p>
                <p class="card-text">
                    Veo cuánto das.<br>
                    Veo todo lo que sostenés.
                </p>
            </div>
        </section>
    </div>

    <!-- MAGAZINE CONTENT -->
    <div id="magazine" class="tab-content">
        <!-- MAGAZINE COVER -->
        <section class="magazine-cover">
            <div class="magazine-cover-container">
                <div class="magazine-cover-text">
                    <div class="magazine-date">10 OCTOBER 2026</div>
                    <div class="magazine-issue">ISSUE 001</div>
                    <div class="magazine-title">I SEE YOU.</div>
                    <div class="magazine-divider"></div>
                    <div class="magazine-tags">
                        ART<br>
                        TRAVEL<br>
                        IDEAS<br>
                        PEOPLE<br>
                        PLACES
                    </div>
                    <div class="magazine-vol">VOL. 01</div>
                </div>
                <div class="magazine-cover-image-container">
                    <img src="jea-cover.jpg" alt="I SEE YOU Magazine Cover - Jea" class="magazine-image">
                </div>
            </div>
        </section>
    </div>

    <script>
        function switchTab(tabName) {
            // Hide all tab contents
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => {
                content.classList.remove('active');
            });

            // Remove active class from all buttons
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(button => {
                button.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');

            // Activate button
            event.target.classList.add('active');

            // Scroll to top of selected tab
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
